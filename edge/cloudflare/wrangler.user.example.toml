# Generic Herdr Cloudflare Edge config.
# Copy to wrangler.user.toml (keep that local) and replace the placeholders.
# A custom domain is OPTIONAL: workers.dev is the default supported endpoint.

name = "herdr-edge"
main = "src/index.ts"
compatibility_date = "2024-09-23"
workers_dev = true
routes = []

[vars]
EDGE_ENV = "prod"
EDGE_PROJECT = "herdr-edge"
EDGE_VERSION = "0.1.0"
DEFAULT_WORKSTATION_ID = "my-workstation"
# For workers.dev, set this to the exact stable Worker origin:
OAUTH_ISSUER = "https://herdr-edge.YOUR_ACCOUNT_SUBDOMAIN.workers.dev"

[durable_objects]
bindings = [
  { name = "WORKSTATION_DO", class_name = "WorkstationDO" },
  { name = "OAUTH_STORE_DO", class_name = "OAuthStoreDO" },
  { name = "DEVICE_REGISTRY_DO", class_name = "DeviceRegistryDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkstationDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["OAuthStoreDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["DeviceRegistryDO"]

# Optional artifact relay bucket. R2 is NOT part of the core install: the core
# Worker deploys and runs correctly without any R2 binding or permission, and
# artifact relay endpoints report artifact_relay_disabled while it is absent.
# Enable it only when the user explicitly wants the optional artifact relay:
# 1. uncomment this block and choose a unique bucket name per Worker/account;
# 2. grant the token Account -> Workers R2 Storage -> Edit (plus any R2
#    billing/subscription step Cloudflare requires);
# 3. run `node provision-r2.mjs --config wrangler.user.toml` before deploy.
# Do not attach a public r2.dev domain or make this bucket publicly readable.
# [[r2_buckets]]
# binding = "ARTIFACT_BUCKET"
# bucket_name = "herdr-edge-artifacts"

[triggers]
crons = ["*/10 * * * *"]

# Optional after workers.dev validation:
# [[routes]]
# pattern = "herdr.example.com"
# custom_domain = true
#
# If you switch to a Custom Domain, OAUTH_ISSUER should use that same stable origin
# BEFORE you register/connect a new ChatGPT connector. Existing OAuth identities
# should not be casually changed after clients are attached.
