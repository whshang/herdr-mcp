[package]
name = "herdr-mcp"
version = "0.4.0-alpha.1"
edition = "2024"
license = "MIT"
description = "Native Herdr MCP runtime and supervisor"

[[bin]]
name = "herdr-mcp"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
axum = "0.8"
regex = "1"
serde_json = "1.0"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
