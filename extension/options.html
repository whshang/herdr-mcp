<!DOCTYPE html>
<html lang="en" class="i18n-pending">
<head>
  <meta charset="utf-8">
  <style>
    .i18n-pending body { visibility: hidden; }
    :root {
      color-scheme: light;
      --ink:#171717;
      --muted:#666;
      --line:#eaeaea;
      --surface:#fff;
      --surface-soft:#fafafa;
      --accent:#006bff;
    }
    * { box-sizing: border-box; }
    body {
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 720px;
      margin: 0 auto;
      color: var(--ink);
      padding: 32px 20px 56px;
      background:var(--surface-soft);
    }
    .hero { display:flex; gap:12px; align-items:center; margin-bottom:24px; }
    .brand-mark {
      width:36px;
      height:36px;
      border-radius:8px;
      display:grid;
      place-items:center;
      background:var(--ink);
      color:white;
      font-size:17px;
      font-weight:700;
    }
    h1 { font-size:20px; line-height:1.25; letter-spacing:-.3px; margin:0; }
    h2 { font-size:14px; line-height:20px; margin:0 0 4px; }
    .subtitle { color:var(--muted); margin-top:2px; font-size:13px; }
    .card {
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:12px;
      padding:18px;
      margin:12px 0;
    }
    .field { margin-top:16px; }
    .field:first-of-type { margin-top:12px; }
    label { display:block; margin:0 0 5px; font-weight:600; font-size:13px; }
    input[type=text], input[type=password], input[type=number], textarea, select {
      width:100%;
      min-height:40px;
      padding:9px 11px;
      border:1px solid #d8d8d8;
      border-radius:6px;
      font:13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      background:#fff;
      color:var(--ink);
    }
    select { font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    textarea { min-height:88px; resize:vertical; }
    input:focus, textarea:focus, select:focus, button:focus-visible, summary:focus-visible {
      outline:none;
      box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--accent);
    }
    button {
      min-height:40px;
      padding:0 12px;
      border:1px solid var(--line);
      background:#fff;
      border-radius:6px;
      color:var(--ink);
      font-weight:600;
      cursor:pointer;
    }
    button:hover { background:#f2f2f2; }
    button.primary { background:var(--ink); border-color:var(--ink); color:#fff; }
    button.primary:hover { background:#333; }
    .hint { color:var(--muted); font-size:12px; line-height:1.45; margin-top:4px; }
    .switch-row { display:grid; grid-template-columns:22px 1fr; gap:2px 8px; align-items:start; padding:13px 0; border-top:1px solid var(--line); }
    .switch-row:first-of-type { border-top:0; }
    .switch-row input { margin-top:4px; }
    .switch-row label { margin:0; }
    .switch-row .hint { grid-column:2; }
    details.subsection { border-top:1px solid var(--line); padding:12px 0 0; margin-top:4px; }
    details.subsection summary,
    details.card > summary { cursor:pointer; font-weight:600; list-style:none; }
    details.subsection summary::-webkit-details-marker,
    details.card > summary::-webkit-details-marker { display:none; }
    details.subsection summary::after,
    details.card > summary::after { content:"›"; float:right; color:#8f8f8f; transform:rotate(90deg); }
    details[open] > summary::after { transform:rotate(-90deg); }
    details.subsection .content { padding:8px 0 2px; }
    details.card > .content { padding-top:10px; }
    .badge { display:inline-block; margin-left:6px; padding:1px 6px; border-radius:999px; background:#f2f2f2; color:#666; font-size:10px; font-weight:700; vertical-align:1px; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:16px; }
    .page-actions { justify-content:flex-end; margin-top:18px; }
    #status { margin-top:12px; font-size:13px; padding:10px 12px; border-radius:6px; background:#f5f5f5; }
    #status:empty { display:none; }
    #status a { color:var(--accent); font-weight:600; }
    .ok { color:#107d32; }
    .err { color:#d8001b; white-space:pre-line; }
    @media (max-width: 520px) {
      body { padding:20px 12px 40px; }
      .card { padding:16px; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="brand-mark" aria-hidden="true">H</div>
    <div>
      <h1 id="title">Herdr · Settings</h1>
      <div id="subtitle" class="subtitle">Connect web AI conversations to your local Herdr workspace.</div>
    </div>
  </div>

  <section class="card">
    <h2 id="title_general">General</h2>
    <div class="field">
      <label id="lab_locale">Language</label>
      <select id="uiLocale">
        <option value="en">English</option>
        <option value="zh">简体中文</option>
        <option value="ja">日本語</option>
      </select>
      <div class="hint" id="hint_locale"></div>
    </div>

    <div class="switch-row">
      <input type="checkbox" id="automationMode">
      <label id="lab_automation_mode" for="automationMode">Allow ChatGPT Project-shared Auto controls</label>
      <div class="hint" id="hint_automation_mode"></div>
    </div>
  </section>

  <section class="card">
    <h2 id="title_supported_webchat">Supported WebChat site access</h2>
    <div class="hint" id="hint_supported_webchat"></div>
    <div class="switch-row">
      <input type="checkbox" id="grokSiteAccess">
      <label id="lab_grok_site_access" for="grokSiteAccess">Allow grok.com</label>
      <div class="hint" id="hint_grok_site_access"></div>
    </div>

    <details class="subsection">
      <summary><span id="title_experimental">Experimental features</span><span id="experimental_badge" class="badge">EXPERIMENTAL</span></summary>
      <div class="content">
        <div class="hint" id="hint_experimental"></div>
        <div class="switch-row">
          <input type="checkbox" id="experimentalZAiEnabled">
          <label id="lab_experimental_zai" for="experimentalZAiEnabled">Enable chat.z.ai integration</label>
          <div class="hint" id="hint_experimental_zai"></div>
        </div>
        <div class="switch-row">
          <input type="checkbox" id="experimentalDeepSeekEnabled">
          <label id="lab_experimental_deepseek" for="experimentalDeepSeekEnabled">Enable chat.deepseek.com integration</label>
          <div class="hint" id="hint_experimental_deepseek"></div>
        </div>
        <div class="switch-row">
          <input type="checkbox" id="experimentalGeminiEnabled">
          <label id="lab_experimental_gemini" for="experimentalGeminiEnabled">Enable gemini.google.com integration</label>
          <div class="hint" id="hint_experimental_gemini"></div>
        </div>
      </div>
    </details>

    <details class="subsection">
      <summary id="title_page_assist">Page Assist</summary>
      <div class="content">
        <div class="hint" id="hint_page_assist">Explicit per-origin permissions for generic page inspection and interaction.</div>
        <div class="field">
          <label id="lab_page_assist_origins">Allowed origins</label>
          <textarea id="pageAssistOrigins" placeholder="https://example.com"></textarea>
          <div class="hint" id="hint_page_assist_origins"></div>
        </div>
      </div>
    </details>
  </section>

  <details class="card">
    <summary id="title_continuity">Advanced settings</summary>
    <div class="content">
      <div class="field">
        <label id="lab_url">Local runtime URL</label>
        <input type="text" id="url" placeholder="http://127.0.0.1:8772">
        <div class="hint" id="hint_url"></div>
      </div>
      <div class="field">
        <label id="lab_wake">Completion message template</label>
        <textarea id="template">{agent} · {pane} · {status} · {output}</textarea>
        <div class="hint" id="hint_wake"></div>
      </div>
      <div class="field">
        <label id="lab_manual_continue">Continue message</label>
        <textarea id="manualContinueMessage"></textarea>
        <div class="hint" id="hint_manual_continue"></div>
      </div>
      <div class="field">
        <label id="lab_tick">Progress check interval</label>
        <input type="number" id="progressTickSec" min="0" step="1">
        <div class="hint" id="hint_tick"></div>
      </div>
      <div class="field">
        <label id="lab_fallback">Unchanged-status interval</label>
        <input type="number" id="progressFallbackSec" min="0" step="1">
        <div class="hint" id="hint_fallback"></div>
      </div>
      <div class="field">
        <label id="lab_progress">Working message template</label>
        <textarea id="progressTemplate">{agent} still running {pane} ({status})</textarea>
        <div class="hint" id="hint_progress"></div>
      </div>
      <div class="field">
        <h2 id="title_diagnostics">Connection check</h2>
        <div class="hint" id="hint_diagnostics"></div>
        <div class="actions">
          <button id="test">Test connection</button>
        </div>
      </div>
    </div>
  </details>

  <div class="actions page-actions">
    <button class="primary" id="save">Save settings</button>
  </div>
  <div id="status"></div>

  <script type="module" src="options.js"></script>
</body>
</html>
