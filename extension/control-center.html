<!doctype html>
<html lang="en" class="i18n-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Herdr Control Center</title>
  <link rel="stylesheet" href="control-center.css">
</head>
<body>
  <main class="control-center">
    <header class="topbar">
      <div class="topbar-row">
        <strong id="pageTitle" class="brand" data-i18n="cc_brand">Herdr</strong>
        <span id="runtimeDot" class="dot offline"></span>
        <span id="runtimeText" data-i18n="cc_runtime_connecting">Runtime connecting…</span>
        <span id="runtimeStats" class="stats">0 working</span>
        <span class="topbar-spacer"></span>
        <div class="toolbar">
          <button id="refreshButton" type="button" class="ghost compact-action" data-i18n="cc_refresh">Refresh</button>
          <button id="collapseButton" type="button" class="ghost compact-action" data-i18n="cc_collapse_all">Collapse</button>
          <button id="settingsButton" type="button" class="ghost compact-action" data-i18n="cc_settings">Settings</button>
        </div>
      </div>
    </header>

    <section id="pageContextCard" class="page-context-strip" aria-live="polite" hidden>
      <strong id="pageContextTitle"></strong>
      <span class="context-separator">·</span>
      <span id="pageContextMeta"></span>
      <span id="pageContextHelp" class="context-error" hidden></span>
    </section>

    <section class="workspace-panel" aria-label="Herdr workspaces" data-i18n-aria="cc_workspace_aria">
      <div id="workspaceList" class="workspace-list">
        <div class="empty" data-i18n="cc_loading">Loading local Herdr state…</div>
      </div>
    </section>

    <section id="controlDock" class="control-dock" aria-label="Pane actions" data-i18n-aria="cc_target_aria" hidden>
      <div id="targetCard" class="target-card">
        <div class="target-heading">
          <strong id="targetTitle">Pane actions</strong>
          <span id="targetKindBadge" class="target-kind-badge" hidden></span>
          <span class="spacer"></span>
          <button id="unpinButton" type="button" class="ghost" data-i18n="cc_unpin">Collapse</button>
        </div>
        <div id="targetDetails" class="target-details"></div>
        <div class="read-actions">
          <button id="inspectButton" type="button" disabled data-i18n="cc_inspect_state">Details</button>
          <button id="readTailButton" type="button" disabled data-i18n="cc_read_tail">Recent output</button>
        </div>

        <div id="actionHeading" hidden></div>
        <span id="actionModeBadge" hidden></span>
        <span id="riskBadge" hidden></span>
        <div id="agentQuickActions" class="agent-quick-actions" hidden>
          <button id="interruptButton" type="button" class="danger" disabled data-i18n="cc_interrupt_agent">Stop task</button>
          <span data-i18n="cc_interrupt_agent_help">Same as Ctrl+C.</span>
        </div>
        <div id="modeTabs" class="mode-tabs" role="tablist" aria-label="Action" data-i18n-aria="cc_mode_aria" hidden></div>
        <div id="modeHelp" class="mode-help"></div>

        <textarea id="composer" hidden></textarea>
        <div id="composerFooter" class="composer-footer" hidden>
          <span id="blockedReason" class="blocked-reason"></span>
          <button id="sendButton" type="button" class="primary" data-i18n="cc_preview_action">Preview</button>
        </div>
        <pre id="result" class="result" aria-live="polite"></pre>
      </div>
    </section>
  </main>
  <script type="module" src="control-center.js"></script>
</body>
</html>
