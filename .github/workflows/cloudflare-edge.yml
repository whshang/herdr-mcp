name: Cloudflare Edge production

on:
  push:
    branches: [main]
    paths:
      - "edge/cloudflare/**"
      - "!edge/cloudflare/**/*.md"
      - "src/relay/**"
      - "tests/relay-*.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-edge.yml"
      - "scripts/ci-herdr-runtime.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-edge-production
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start Herdr runtime (pinned, headless)
        run: scripts/ci-herdr-runtime.sh start
      - name: Frozen Edge/contract gate
        run: npm run test:edge
      - name: Root regression gate
        run: npm test
      - name: Stop Herdr runtime
        if: always()
        run: scripts/ci-herdr-runtime.sh stop

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: edge/cloudflare
          wranglerVersion: "4"
          command: deploy --config wrangler.prod.toml
      - name: Verify workers.dev health
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            https://herdr-edge-prod.whshang.workers.dev/health
