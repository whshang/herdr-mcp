name: Rust Release Recovery

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed Rust Release workflow run containing the attested rust-release-bundle
        required: true
        type: string
      tag:
        description: Existing immutable release tag to publish
        required: true
        type: string

permissions:
  actions: read
  attestations: read
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate source run and immutable tag
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "invalid source_run_id" >&2; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || { echo "invalid release tag" >&2; exit 1; }
          git show-ref --verify --quiet "refs/tags/$TAG" || { echo "release tag is not present in the repository" >&2; exit 1; }
          source_digest="$(git rev-parse "$TAG^{commit}")"
          source_version="$(git show "${source_digest}:crates/herdr-mcp/Cargo.toml" | awk -F'\"' '/^version = / { print $2; exit }')"
          [[ "$TAG" == "v$source_version" ]] || { echo "tag does not match source Cargo version" >&2; exit 1; }
          source_state_schema="$(git show "${source_digest}:crates/herdr-mcp/src/state_store.rs" | sed -nE 's/^pub const SCHEMA_VERSION: i64 = ([0-9]+);$/\1/p' | head -n1)"
          [[ "$source_state_schema" =~ ^[0-9]+$ ]] || { echo "cannot read source state schema" >&2; exit 1; }
          source_contract="$(git show "${source_digest}:contracts/epoch2.json")"
          source_contract_epoch="$(jq -r '.contract_epoch' <<<"$source_contract")"
          source_contract_hash="$(jq -r '.contract_hash' <<<"$source_contract")"
          source_tool_count="$(jq -r '.tool_count' <<<"$source_contract")"
          source_targets="$(git show "${source_digest}:.github/rust-release-targets.json")"
          jq -e '.schema_version == 1 and (.targets | length > 0) and ([.targets[].runner, .targets[].target] | all(type == "string" and length > 0))' <<<"$source_targets" >/dev/null
          source_target_matrix="$(jq -c '.targets' <<<"$source_targets")"
          source_target_count="$(jq '.targets | length' <<<"$source_targets")"
          source_release_asset_count="$((source_target_count + 1))"

          run_json="$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID")"
          [[ "$(jq -r '.event' <<<"$run_json")" == "push" ]] || { echo "source run was not triggered by a tag push" >&2; exit 1; }
          [[ "$(jq -r '.path' <<<"$run_json")" == ".github/workflows/rust-release.yml" ]] || { echo "source run used an unexpected workflow" >&2; exit 1; }
          [[ "$(jq -r '.head_sha' <<<"$run_json")" == "$source_digest" ]] || { echo "source run SHA does not match immutable tag commit" >&2; exit 1; }
          [[ "$(jq -r '.head_branch' <<<"$run_json")" == "$TAG" ]] || { echo "source run tag does not match requested tag" >&2; exit 1; }

          jobs_json="$(gh api --paginate "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100")"
          jq -e '[.jobs[] | select(.name=="verify" and .conclusion=="success")] | length == 1' <<<"$jobs_json" >/dev/null
          jq -e '[.jobs[] | select(.name=="targets" and .conclusion=="success")] | length == 1' <<<"$jobs_json" >/dev/null
          jq -e '[.jobs[] | select(.name=="manifest" and .conclusion=="success")] | length == 1' <<<"$jobs_json" >/dev/null
          jq -e '[.jobs[] | select(.name=="attest" and .conclusion=="success")] | length == 1' <<<"$jobs_json" >/dev/null
          expected_build_jobs="$(jq -c '[.targets[] | "build (\(.runner), \(.target))"] | sort' <<<"$source_targets")"
          actual_build_jobs="$(jq -c '[.jobs[] | select((.name | startswith("build (")) and .conclusion=="success") | .name] | sort' <<<"$jobs_json")"
          [[ "$actual_build_jobs" == "$expected_build_jobs" ]] || { echo "source run build matrix does not match tagged target contract" >&2; exit 1; }

          artifacts_json="$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")"
          jq -e '[.artifacts[] | select(.name=="rust-release-bundle" and .expired==false)] | length == 1' <<<"$artifacts_json" >/dev/null

          echo "source_digest=$source_digest" >> "$GITHUB_OUTPUT"
          echo "source_version=$source_version" >> "$GITHUB_OUTPUT"
          echo "source_state_schema=$source_state_schema" >> "$GITHUB_OUTPUT"
          echo "source_contract_epoch=$source_contract_epoch" >> "$GITHUB_OUTPUT"
          echo "source_contract_hash=$source_contract_hash" >> "$GITHUB_OUTPUT"
          echo "source_tool_count=$source_tool_count" >> "$GITHUB_OUTPUT"
          echo "source_target_matrix=$source_target_matrix" >> "$GITHUB_OUTPUT"
          echo "source_release_asset_count=$source_release_asset_count" >> "$GITHUB_OUTPUT"

      - name: Download exact attested release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-release-bundle
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          path: release-assets

      - name: Verify release manifest and file digests
        env:
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          SOURCE_VERSION: ${{ steps.source.outputs.source_version }}
          SOURCE_STATE_SCHEMA: ${{ steps.source.outputs.source_state_schema }}
          SOURCE_CONTRACT_EPOCH: ${{ steps.source.outputs.source_contract_epoch }}
          SOURCE_CONTRACT_HASH: ${{ steps.source.outputs.source_contract_hash }}
          SOURCE_TOOL_COUNT: ${{ steps.source.outputs.source_tool_count }}
          SOURCE_TARGET_MATRIX: ${{ steps.source.outputs.source_target_matrix }}
          SOURCE_DIGEST: ${{ steps.source.outputs.source_digest }}
          GH_REPOSITORY_ID: ${{ github.repository_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote

          root = Path("release-assets")
          manifest_path = root / "release-manifest.json"
          manifest = json.loads(manifest_path.read_text())
          repo = os.environ["GH_REPO"]
          tag = os.environ["TAG"]
          source_version = os.environ["SOURCE_VERSION"]
          source_state_schema = int(os.environ["SOURCE_STATE_SCHEMA"])
          source_contract_epoch = int(os.environ["SOURCE_CONTRACT_EPOCH"])
          source_contract_hash = os.environ["SOURCE_CONTRACT_HASH"]
          source_tool_count = int(os.environ["SOURCE_TOOL_COUNT"])
          source_digest = os.environ["SOURCE_DIGEST"]
          repository_id = int(os.environ["GH_REPOSITORY_ID"])
          target_matrix = json.loads(os.environ["SOURCE_TARGET_MATRIX"])
          targets = [entry["target"] for entry in target_matrix]
          if manifest.get("schema_version") != 2 or manifest.get("product") != "herdr-mcp":
              raise SystemExit("invalid release manifest identity")
          if manifest.get("tag") != tag or manifest.get("version") != source_version:
              raise SystemExit("release manifest version/tag mismatch")
          if manifest.get("state_schema") != source_state_schema:
              raise SystemExit("release manifest state schema mismatch")
          if manifest.get("release_identity") != {
              "tag": tag,
              "source_commit": source_digest,
              "source_ref": f"refs/tags/{tag}",
          }:
              raise SystemExit("release manifest source identity mismatch")
          if manifest.get("repository_identity") != {
              "repository": repo,
              "repository_id": repository_id,
          }:
              raise SystemExit("release manifest repository identity mismatch")
          if manifest.get("provenance") != {
              "predicate_type": "https://slsa.dev/provenance/v1",
              "attestation": "github-artifact-attestation",
              "bundle_media_type": "application/vnd.dev.sigstore.bundle.v0.3+json",
              "workflow": ".github/workflows/rust-release.yml",
              "workflow_name": "Rust Release",
              "issuer": "https://token.actions.githubusercontent.com",
              "runner_environment": "github-hosted",
          }:
              raise SystemExit("release manifest provenance identity mismatch")
          contract = manifest.get("contract") or {}
          if contract != {
              "epoch": source_contract_epoch,
              "hash": source_contract_hash,
              "tool_count": source_tool_count,
          }:
              raise SystemExit("release manifest contract mismatch")
          assets = manifest.get("assets") or []
          if len(assets) != len(targets) or {asset.get("target") for asset in assets} != set(targets):
              raise SystemExit("release manifest targets do not match tagged target contract")
          expected = {"release-manifest.json"}
          for asset in assets:
              target = asset["target"]
              name = asset["name"]
              expected_name = f"herdr-mcp-{source_version}-{target}{'.exe' if 'windows' in target else ''}"
              if name != expected_name:
                  raise SystemExit(f"release asset name mismatch: {name}")
              expected.add(name)
              path = root / name
              data = path.read_bytes()
              if len(data) != asset["size"]:
                  raise SystemExit(f"size mismatch: {name}")
              if hashlib.sha256(data).hexdigest() != asset["sha256"]:
                  raise SystemExit(f"sha256 mismatch: {name}")
              expected_url = f"https://github.com/{repo}/releases/download/{quote(tag, safe='')}/{quote(name, safe='')}"
              if asset.get("url") != expected_url:
                  raise SystemExit(f"non-GitHub or mismatched release URL: {name}")
          actual = {p.name for p in root.iterdir() if p.is_file()}
          if actual != expected:
              raise SystemExit(f"unexpected release bundle files: {sorted(actual ^ expected)}")
          PY

      - name: Verify GitHub/Sigstore provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          SOURCE_DIGEST: ${{ steps.source.outputs.source_digest }}
        shell: bash
        run: |
          set -euo pipefail
          for artifact in release-assets/*; do
            gh attestation verify "$artifact" \
              --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/rust-release.yml" \
              --source-ref "refs/tags/$TAG" \
              --source-digest "$SOURCE_DIGEST" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
              --deny-self-hosted-runners
          done

      - name: Publish recovered GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          EXPECTED_RELEASE_ASSET_COUNT: ${{ steps.source.outputs.source_release_asset_count }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; refusing recovery overwrite" >&2
            exit 1
          fi
          release_flags=(--verify-tag --generate-notes)
          if [[ "$TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$TAG" release-assets/* "${release_flags[@]}"

          release_json="$(gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets,url)"
          [[ "$(jq -r '.tagName' <<<"$release_json")" == "$TAG" ]]
          [[ "$(jq -r '.isDraft' <<<"$release_json")" == "false" ]]
          if [[ "$TAG" == *-* ]]; then
            [[ "$(jq -r '.isPrerelease' <<<"$release_json")" == "true" ]]
          fi
          [[ "$(jq '.assets | length' <<<"$release_json")" == "$EXPECTED_RELEASE_ASSET_COUNT" ]]
          echo "$release_json" | jq -c '{tagName,isDraft,isPrerelease,url,assets:[.assets[].name]}'
