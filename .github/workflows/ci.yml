name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: [self-hosted, Linux, X64, herdr-box, ci]
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # Only trusted main pushes may seed the shared compiler cache.
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Configure Rust compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Rust release gate
        run: scripts/release-gate.sh rust

  test:
    runs-on: [self-hosted, Linux, X64, herdr-box, ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historical ChatGPT App-identity regressions span 18 ancestor commits.
          fetch-depth: 32
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Deno Relay gate
        run: |
          deno fmt --check relay/deno
          deno lint relay/deno
          deno check relay/deno/server.ts relay/deno/server_test.ts
          deno test --allow-read relay/deno/server_test.ts
      - name: New test policy
        env:
          TEST_POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: node scripts/lint-test-policy.mjs "$TEST_POLICY_BASE_SHA"
      - name: Select Node test scope
        id: node_scope
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_TEST_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: node scripts/select-ci-tests.mjs "$CI_TEST_BASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Node/docs/Edge release gate
        run: scripts/ci-node-gate.sh "${{ steps.node_scope.outputs.mode }}"
      - name: Package and diff hygiene
        run: scripts/release-gate.sh hygiene
