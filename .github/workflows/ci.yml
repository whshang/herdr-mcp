name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Rust format
        run: cargo fmt --check
      - name: Rust lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --workspace

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build documentation site
        run: npm run build:site
      - name: Start Herdr runtime (pinned, headless)
        run: scripts/ci-herdr-runtime.sh start
      - run: npm test
      - run: npm run test:edge
      - name: Browser extension smoke
        run: node tests/manual/extension_smoke.mjs
      - name: Shell syntax
        run: bash -n bin/herdr-mcp bin/watchdog.sh bin/lib/i18n.sh scripts/ci-herdr-runtime.sh
      - name: Package surface
        run: npm pack --dry-run
      - name: Diff hygiene
        run: git diff --check
      - name: Stop Herdr runtime
        if: always()
        run: scripts/ci-herdr-runtime.sh stop
