name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # Only trusted main pushes may seed the shared compiler cache.
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Configure Rust compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Rust release gate
        run: scripts/release-gate.sh rust

  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      HERDR_MCP_BUILD_CHANNEL: dev
      HERDR_MCP_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build Windows UAT candidate
        shell: pwsh
        run: cargo +1.97.1 build --locked --release -p herdr-mcp --target x86_64-pc-windows-msvc
      - name: Stage Windows UAT bundle
        shell: pwsh
        run: |
          $line = Select-String -Path crates/herdr-mcp/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if (-not $line) { throw "cannot resolve herdr-mcp version" }
          $version = $line.Matches[0].Groups[1].Value
          $edgeOut = Join-Path $env:RUNNER_TEMP "herdr-edge"
          New-Item -ItemType Directory -Force -Path $edgeOut, "windows-uat" | Out-Null
          npx --yes wrangler@4.129.0 deploy --dry-run --outdir $edgeOut --config edge/cloudflare/wrangler.user.example.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "target/x86_64-pc-windows-msvc/release/herdr-mcp.exe" "windows-uat/herdr-mcp.exe"
          Copy-Item (Join-Path $edgeOut "index.js") "windows-uat/herdr-edge-$version.mjs"
          @(
            "commit=$env:GITHUB_SHA"
            "version=$version"
            "channel=dev"
          ) | Set-Content -Encoding ascii "windows-uat/BUILD.txt"
          & "windows-uat/herdr-mcp.exe" --version
      - uses: actions/upload-artifact@v4
        with:
          name: windows-uat
          path: windows-uat/*
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Deno Relay gate
        run: |
          deno fmt --check relay/deno
          deno lint relay/deno
          deno check relay/deno/server.ts relay/deno/server_test.ts
          deno test --allow-read relay/deno/server_test.ts
      - name: Node/docs/Edge release gate
        run: scripts/release-gate.sh node
      - name: Package and diff hygiene
        run: scripts/release-gate.sh hygiene
