name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # Only trusted main pushes may seed the shared compiler cache.
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Configure Rust compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Rust release gate
        run: scripts/release-gate.sh rust

  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
      HERDR_MCP_BUILD_CHANNEL: dev
      HERDR_MCP_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build Windows UAT candidate
        shell: pwsh
        run: cargo +1.97.1 build --locked --release -p herdr-mcp --target x86_64-pc-windows-msvc
      - name: Start pinned Herdr 0.9.0 server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "herdr-windows-x86_64.zip"
          $root = Join-Path $env:RUNNER_TEMP "herdr-0.9.0"
          Invoke-WebRequest -Uri "https://github.com/herdrdev/herdr/releases/download/v0.9.0/herdr-windows-x86_64.zip" -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "b4508c445de1c1a68c760a01735da2aba2fa214b2aafd4b07f732e49b2a64b11"
          if ($actual -ne $expected) { throw "Herdr 0.9.0 Windows archive SHA-256 mismatch" }
          Expand-Archive -Path $archive -DestinationPath $root -Force
          $herdr = Get-ChildItem -Path $root -Filter herdr.exe -File -Recurse | Select-Object -First 1
          if (-not $herdr) { throw "herdr.exe missing from Herdr 0.9.0 Windows archive" }
          "HERDR_UAT_BIN=$($herdr.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $stdout = Join-Path $env:RUNNER_TEMP "herdr-server.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "herdr-server.stderr.log"
          $server = Start-Process -FilePath $herdr.FullName -ArgumentList @("server") -WindowStyle Hidden -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $ready = $false
          for ($attempt = 0; $attempt -lt 20; $attempt++) {
            Start-Sleep -Milliseconds 250
            $serverStatus = (& $herdr.FullName status server --json | ConvertFrom-Json)
            if ($serverStatus.running -eq $true) { $ready = $true; break }
            if ($server.HasExited) { break }
          }
          if (-not $ready) {
            Write-Host "--- Herdr stdout ---"
            if (Test-Path $stdout) { Get-Content $stdout }
            Write-Host "--- Herdr stderr ---"
            if (Test-Path $stderr) { Get-Content $stderr }
            throw "Herdr 0.9.0 headless server did not become ready"
          }
      - name: Windows user-process lifecycle smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidate = (Resolve-Path "target/x86_64-pc-windows-msvc/release/herdr-mcp.exe").Path
          try {
            & $candidate install
            if ($LASTEXITCODE -ne 0) { throw "Windows install smoke failed" }
            $status = (& $candidate service status | ConvertFrom-Json)
            if ($status.implementation -ne "rust-windows-process-user") { throw "unexpected Windows service implementation" }
            if (-not $status.autostart_registered) { throw "HKCU login autostart was not registered" }
            if (-not $status.loaded) { throw "Windows runtime process is not active" }
            if (-not $status.healthy) { throw "Windows runtime process is not healthy" }
            $runValue = & reg.exe query "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v "Herdr MCP Runtime"
            if ($LASTEXITCODE -ne 0 -or ($runValue -join "`n") -notmatch "service start") { throw "HKCU Run registration is missing or invalid" }
            & schtasks.exe /Query /TN "Herdr MCP Runtime" *> $null
            if ($LASTEXITCODE -eq 0) { throw "legacy scheduled task was unexpectedly created" }
          }
          finally {
            & $candidate service uninstall *> $null
            if ($env:HERDR_UAT_BIN) { & $env:HERDR_UAT_BIN server stop *> $null }
          }
      - name: Stage Windows UAT bundle
        shell: pwsh
        run: |
          $line = Select-String -Path crates/herdr-mcp/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if (-not $line) { throw "cannot resolve herdr-mcp version" }
          $version = $line.Matches[0].Groups[1].Value
          $edgeOut = Join-Path $env:RUNNER_TEMP "herdr-edge"
          New-Item -ItemType Directory -Force -Path $edgeOut, "windows-uat" | Out-Null
          npx --yes wrangler@4.129.0 deploy --dry-run --outdir $edgeOut --config edge/cloudflare/wrangler.user.example.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "target/x86_64-pc-windows-msvc/release/herdr-mcp.exe" "windows-uat/herdr-mcp.exe"
          Copy-Item (Join-Path $edgeOut "index.js") "windows-uat/herdr-edge-$version.mjs"
          @(
            "commit=$env:GITHUB_SHA"
            "version=$version"
            "channel=dev"
          ) | Set-Content -Encoding ascii "windows-uat/BUILD.txt"
          & "windows-uat/herdr-mcp.exe" --version
      - uses: actions/upload-artifact@v4
        with:
          name: windows-uat
          path: windows-uat/*
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Deno Relay gate
        run: |
          deno fmt --check relay/deno
          deno lint relay/deno
          deno check relay/deno/server.ts relay/deno/server_test.ts
          deno test --allow-read relay/deno/server_test.ts
      - name: Node/docs/Edge release gate
        run: scripts/release-gate.sh node
      - name: Package and diff hygiene
        run: scripts/release-gate.sh hygiene
