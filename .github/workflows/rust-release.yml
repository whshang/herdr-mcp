name: Rust Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Authoritative release gate
        run: scripts/release-gate.sh full

  targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load authoritative Rust release targets
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.schema_version == 1 and (.targets | length > 0) and ([.targets[].runner, .targets[].target] | all(type == "string" and length > 0))' .github/rust-release-targets.json >/dev/null
          matrix="$(jq -c '{include: .targets}' .github/rust-release-targets.json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: [verify, targets]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal --target "${{ matrix.target }}"
      - name: Build release binary
        shell: bash
        run: cargo build --locked --release -p herdr-mcp --target "${{ matrix.target }}"
      - name: Sign macOS release or qualification identity
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && contains(matrix.target, 'apple-darwin')
        shell: bash
        env:
          HERDR_MACOS_CERT_P12_BASE64: ${{ secrets.HERDR_MACOS_CERT_P12_BASE64 }}
          HERDR_MACOS_CERT_PASSWORD: ${{ secrets.HERDR_MACOS_CERT_PASSWORD }}
          HERDR_MACOS_SIGNING_IDENTITY: ${{ secrets.HERDR_MACOS_SIGNING_IDENTITY }}
          HERDR_MACOS_TEAM_ID: ${{ vars.HERDR_MACOS_TEAM_ID }}
        run: scripts/sign-macos-release.sh "target/${{ matrix.target }}/release/herdr-mcp"
      - name: Stage raw release asset
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk -F'\"' '/^version = / { print $2; exit }' crates/herdr-mcp/Cargo.toml)"
          mkdir -p release-assets
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/herdr-mcp.exe" "release-assets/herdr-mcp-${VERSION}-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/herdr-mcp" "release-assets/herdr-mcp-${VERSION}-${{ matrix.target }}"
            chmod 755 "release-assets/herdr-mcp-${VERSION}-${{ matrix.target }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rust-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: rust-*
          path: release-assets
          merge-multiple: true
      - name: Build release manifest
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            VERSION="$(awk -F'\"' '/^version = / { print $2; exit }' crates/herdr-mcp/Cargo.toml)"
            TAG="v${VERSION}"
          fi
          node scripts/build-rust-release-manifest.mjs \
            --root "$PWD" \
            --assets-dir "$PWD/release-assets" \
            --output "$PWD/release-assets/release-manifest.json" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --source-commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --workflow-name "$GITHUB_WORKFLOW"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-release-bundle
          path: release-assets/*
          if-no-files-found: error

  attest:
    needs: manifest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rust-release-bundle
          path: release-assets
      - name: Attest signed release or qualification assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/herdr-mcp-*
            release-assets/release-manifest.json

  qualification:
    needs: attest
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rust-release-bundle
          path: release-assets
      - name: Verify signed qualification source identity
        shell: bash
        run: |
          set -euo pipefail
          manifest="release-assets/release-manifest.json"
          source_commit="$(jq -r '.release_identity.source_commit' "$manifest")"
          source_ref="$(jq -r '.release_identity.source_ref' "$manifest")"
          [[ "$source_commit" == "$GITHUB_SHA" ]] || { echo "qualification source_commit does not match dispatched commit" >&2; exit 1; }
          [[ "$source_ref" == "$GITHUB_REF" ]] || { echo "qualification source_ref does not match dispatched ref" >&2; exit 1; }
          [[ "$source_ref" != refs/tags/* ]] || { echo "qualification mode refuses a tag ref" >&2; exit 1; }
          echo "signed_qualification_ok commit=$source_commit ref=$source_ref assets=$(jq '.assets | length' "$manifest")"
          {
            echo '### Signed qualification bundle'
            echo
            echo "Commit: $source_commit"
            echo "Source ref: $source_ref"
            echo
            echo 'This workflow-dispatch run signs and attests the candidate bundle but never publishes a GitHub Release. Run the signed launchd/TCC qualification before creating the immutable version tag.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: attest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rust-release-bundle
          path: release-assets
      - name: Verify immutable release identity
        id: bundle
        env:
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="release-assets/release-manifest.json"
          tag="$(jq -r '.tag' "$manifest")"
          source_commit="$(jq -r '.release_identity.source_commit' "$manifest")"
          source_ref="$(jq -r '.release_identity.source_ref' "$manifest")"
          [[ "$tag" == "$GITHUB_REF_NAME" ]] || { echo "manifest tag does not match pushed ref" >&2; exit 1; }
          [[ "$source_commit" == "$GITHUB_SHA" ]] || { echo "manifest source_commit does not match tag commit" >&2; exit 1; }
          [[ "$source_ref" == "refs/tags/$GITHUB_REF_NAME" ]] || { echo "manifest source_ref does not match pushed tag" >&2; exit 1; }
          expected_assets="$(jq -c '[.assets[].name] | sort' "$manifest")"
          actual_assets="$(find release-assets -maxdepth 1 -type f -name 'herdr-mcp-*' -printf '%f\n' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          [[ "$actual_assets" == "$expected_assets" ]] || { echo "release bundle binaries do not match manifest assets" >&2; exit 1; }
          release_asset_count="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          echo "release_identity_ok tag=$tag commit=$source_commit assets=$(jq '.assets | length' "$manifest") bundle_files=$release_asset_count"
          echo "release_asset_count=$release_asset_count" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_RELEASE_ASSET_COUNT: ${{ steps.bundle.outputs.release_asset_count }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists; refusing publish overwrite" >&2
            exit 1
          fi
          release_flags=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* "${release_flags[@]}"

          release_json="$(gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,isPrerelease,assets,url)"
          [[ "$(jq -r '.tagName' <<<"$release_json")" == "$GITHUB_REF_NAME" ]]
          [[ "$(jq -r '.isDraft' <<<"$release_json")" == "false" ]]
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            [[ "$(jq -r '.isPrerelease' <<<"$release_json")" == "true" ]]
          fi
          [[ "$(jq '.assets | length' <<<"$release_json")" == "$EXPECTED_RELEASE_ASSET_COUNT" ]]
          echo "$release_json" | jq -c '{tagName,isDraft,isPrerelease,url,assets:[.assets[].name]}'
